<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1100" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Title -->
  <text x="700" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Decision Tree with Cyclical Time Encoding (Sin/Cos Transformation)
  </text>
  
  <!-- Visual representation of the transformation -->
  <rect x="50" y="60" width="600" height="280" fill="#f0f8ff" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="350" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Step 1: Transform Linear Hours to Circular Coordinates
  </text>
  
  <!-- Clock visualization -->
  <circle cx="200" cy="200" r="80" fill="#fff" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Clock markers with specific hours -->
  <!-- 0/24 (12 AM) - TOP -->
  <line x1="200" y1="120" x2="200" y2="135" stroke="#e74c3c" stroke-width="4"/>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e74c3c">0</text>
  <circle cx="200" cy="125" r="6" fill="#e74c3c"/>
  
  <!-- 6 (6 AM) - RIGHT -->
  <line x1="265" y1="200" x2="280" y2="200" stroke="#3498db" stroke-width="3"/>
  <text x="295" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">6</text>
  
  <!-- 12 (12 PM) - BOTTOM -->
  <line x1="200" y1="265" x2="200" y2="280" stroke="#3498db" stroke-width="3"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">12</text>
  
  <!-- 18 (6 PM) - LEFT -->
  <line x1="120" y1="200" x2="135" y2="200" stroke="#3498db" stroke-width="3"/>
  <text x="105" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">18</text>
  
  <!-- Hour 23 (11 PM) - slightly before 0 -->
  <line x1="189" y1="125" x2="189" y2="140" stroke="#27ae60" stroke-width="4"/>
  <text x="170" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">23</text>
  <circle cx="189" cy="133" r="6" fill="#27ae60"/>
  
  <!-- Hour 1 (1 AM) - slightly after 0 -->
  <line x1="211" y1="125" x2="211" y2="140" stroke="#9b59b6" stroke-width="4"/>
  <text x="230" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">1</text>
  <circle cx="211" cy="133" r="6" fill="#9b59b6"/>
  
  <!-- Arc showing closeness -->
  <path d="M 189 133 A 80 80 0 0 1 211 133" stroke="#f39c12" stroke-width="3" fill="none"/>
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
    Close!
  </text>
  
  <!-- Coordinate transformation formulas -->
  <rect x="320" y="130" width="310" height="190" fill="#fff9e6" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="475" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Transformation Formulas
  </text>
  
  <text x="330" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">
    hour_sin = sin(2π × hour / 24)
  </text>
  <text x="330" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">
    hour_cos = cos(2π × hour / 24)
  </text>
  
  <line x1="330" y1="210" x2="620" y2="210" stroke="#666" stroke-width="1"/>
  
  <text x="330" y="230" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#e74c3c">
    Hour 0 (12 AM):
  </text>
  <text x="340" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#666">
    sin = 0.000, cos = 1.000
  </text>
  
  <text x="330" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#27ae60">
    Hour 23 (11 PM):
  </text>
  <text x="340" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#666">
    sin = -0.259, cos = 0.966
  </text>
  
  <text x="330" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#9b59b6">
    Hour 1 (1 AM):
  </text>
  <text x="340" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#666">
    sin = 0.259, cos = 0.966
  </text>
  
  <!-- Coordinate space visualization -->
  <rect x="700" y="60" width="650" height="280" fill="#f0fff0" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="1025" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Step 2: Hours Mapped to 2D Coordinate Space
  </text>
  
  <!-- Coordinate axes -->
  <line x1="900" y1="120" x2="900" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowblack)"/>
  <text x="915" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">sin</text>
  
  <line x1="780" y1="220" x2="1020" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowblack)"/>
  <text x="1010" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">cos</text>
  
  <!-- Grid -->
  <line x1="900" y1="220" x2="1000" y2="220" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="900" y1="220" x2="900" y2="120" stroke="#ddd" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Plot midnight cluster -->
  <circle cx="1000" cy="220" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="1020" y="225" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Hour 0</text>
  
  <circle cx="980" cy="195" r="8" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="995" y="190" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Hour 23</text>
  
  <circle cx="980" cy="245" r="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="995" y="260" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Hour 1</text>
  
  <circle cx="965" cy="170" r="7" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="920" y="165" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">Hour 22</text>
  
  <circle cx="965" cy="270" r="7" fill="#16a085" stroke="#138d75" stroke-width="2"/>
  <text x="920" y="280" font-family="Arial, sans-serif" font-size="10" fill="#16a085">Hour 2</text>
  
  <!-- Cluster boundary -->
  <ellipse cx="975" cy="220" rx="55" ry="70" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="1040" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    Late Night
  </text>
  <text x="1040" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    Cluster
  </text>
  
  <!-- Plot daytime hours -->
  <circle cx="900" cy="280" r="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="850" y="300" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Hour 6</text>
  
  <circle cx="820" cy="220" r="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="770" y="225" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Hour 12</text>
  
  <circle cx="900" cy="160" r="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="850" y="150" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Hour 18</text>
  
  <!-- Decision Tree with Cyclical Features -->
  <rect x="50" y="370" width="1300" height="700" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="700" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Step 3: Decision Tree Using (hour_sin, hour_cos) Features
  </text>
  
  <!-- Root node -->
  <ellipse cx="700" cy="480" rx="120" ry="50" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
  <text x="700" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    hour_cos &gt; 0.85?
  </text>
  <text x="700" y="488" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    (Is it near midnight?)
  </text>
  <text x="700" y="503" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    samples: 25830 | gini: 0.17
  </text>
  
  <!-- Left branch from root -->
  <line x1="620" y1="520" x2="400" y2="600" stroke="#2c3e50" stroke-width="3"/>
  <text x="490" y="555" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">NO</text>
  <text x="480" y="575" font-family="Arial, sans-serif" font-size="11" fill="#666">(Most hours)</text>
  
  <!-- Right branch from root -->
  <line x1="780" y1="520" x2="1000" y2="600" stroke="#2c3e50" stroke-width="3"/>
  <text x="910" y="555" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">YES</text>
  <text x="895" y="575" font-family="Arial, sans-serif" font-size="11" fill="#666">(Near midnight)</text>
  
  <!-- Left child - Daytime hours -->
  <ellipse cx="400" cy="640" rx="110" ry="50" fill="#e74c3c" stroke="#2c3e50" stroke-width="3"/>
  <text x="400" y="630" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    hour_sin &gt; 0.7?
  </text>
  <text x="400" y="648" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    (Morning vs Evening)
  </text>
  <text x="400" y="663" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    samples: 20664 | gini: 0.08
  </text>
  
  <!-- Right child - Midnight cluster -->
  <ellipse cx="1000" cy="640" rx="110" ry="50" fill="#27ae60" stroke="#2c3e50" stroke-width="3"/>
  <text x="1000" y="630" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    hour_sin &lt; 0?
  </text>
  <text x="1000" y="648" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    (Before vs After midnight)
  </text>
  <text x="1000" y="663" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    samples: 5166 | gini: 0.42
  </text>
  
  <!-- Left-Left: Morning (low fraud) -->
  <line x1="330" y1="680" x2="230" y2="750" stroke="#2c3e50" stroke-width="2"/>
  <text x="265" y="710" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">NO</text>
  
  <rect x="130" y="760" width="200" height="90" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="230" y="785" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
    🟢 LEGITIMATE
  </text>
  <text x="230" y="805" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    Hours: 6-11 AM, 1-5 PM
  </text>
  <text x="230" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Fraud rate: 4%
  </text>
  <text x="230" y="838" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    samples: 15498
  </text>
  
  <!-- Left-Right: Evening (moderate fraud) -->
  <line x1="470" y1="680" x2="570" y2="750" stroke="#2c3e50" stroke-width="2"/>
  <text x="535" y="710" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">YES</text>
  
  <rect x="470" y="760" width="200" height="90" fill="#fff9e6" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="570" y="785" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
    🟡 MODERATE RISK
  </text>
  <text x="570" y="805" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    Hours: 6-10 PM
  </text>
  <text x="570" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Fraud rate: 8%
  </text>
  <text x="570" y="838" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    samples: 5166
  </text>
  
  <!-- Right-Left: Just before midnight (HIGH FRAUD) -->
  <line x1="930" y1="680" x2="830" y2="750" stroke="#2c3e50" stroke-width="2"/>
  <text x="865" y="710" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">YES</text>
  
  <rect x="730" y="760" width="200" height="90" fill="#ffe6e6" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <text x="830" y="785" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    🔴 HIGH FRAUD RISK
  </text>
  <text x="830" y="805" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    Hours: 22-23 (10-11 PM)
  </text>
  <text x="830" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Fraud rate: 78% ⚠️
  </text>
  <text x="830" y="838" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    samples: 2583
  </text>
  
  <!-- Right-Right: Just after midnight (HIGH FRAUD) -->
  <line x1="1070" y1="680" x2="1170" y2="750" stroke="#2c3e50" stroke-width="2"/>
  <text x="1135" y="710" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">NO</text>
  
  <rect x="1070" y="760" width="200" height="90" fill="#ffe6e6" stroke="#e74c3c" stroke-width="3" rx="5"/>
  <text x="1170" y="785" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    🔴 HIGH FRAUD RISK
  </text>
  <text x="1170" y="805" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    Hours: 0-2 (12-2 AM)
  </text>
  <text x="1170" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Fraud rate: 81% ⚠️
  </text>
  <text x="1170" y="838" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    samples: 2583
  </text>
  
  <!-- Key Insight Box -->
  <rect x="100" y="900" width="1200" height="150" fill="#e8f8f5" stroke="#16a085" stroke-width="3" rx="10"/>
  <text x="700" y="930" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#16a085">
    ✓ KEY ADVANTAGE: Hours 22, 23, 0, 1, 2 Are Now Grouped Together!
  </text>
  
  <text x="700" y="960" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    With sin/cos encoding, the tree naturally discovers the "late night" pattern as a single cluster
  </text>
  
  <text x="120" y="990" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">
    🎯 Root split (hour_cos &gt; 0.85) directly identifies the midnight region (hours 22-2)
  </text>
  <text x="120" y="1010" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">
    🎯 Subsequent splits (hour_sin &lt; 0) separate "before midnight" from "after midnight" within the cluster
  </text>
  <text x="120" y="1030" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">
    🎯 Both groups correctly identified as HIGH FRAUD despite hour values being 0, 1, 2, 22, 23
  </text>
  
  <!-- Arrows and markers -->
  <defs>
    <marker id="arrowblack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>